<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador de Patentes | Capstone</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: #ffffff;
      color: #212529;
      line-height: 1.5;
      padding: 25px 20px;
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
    }
    header {
      border-bottom: 2px solid #e9ecef;
      padding-bottom: 14px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      color: #1a1a1a;
    }
    .subtitle {
      font-size: 13px;
      color: #6c757d;
      margin-top: 3px;
    }
    /* Search Box */
    .search-section {
      background-color: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #333;
    }
    .input-row {
      display: flex;
      gap: 8px;
    }
    input[type="text"] {
      flex: 1;
      padding: 9px 12px;
      font-size: 14px;
      border: 1px solid #ced4da;
      border-radius: 4px;
      font-family: monospace;
      outline: none;
      background-color: #ffffff;
    }
    input[type="text"]:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 0 2px rgba(13, 110, 253, 0.15);
    }
    button.btn-search {
      padding: 9px 20px;
      font-size: 14px;
      font-weight: 500;
      background-color: #0d6efd;
      color: #ffffff;
      border: 1px solid #0d6efd;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
    }
    button.btn-search:hover {
      background-color: #0b5ed7;
    }
    button:disabled {
      background-color: #6c757d;
      border-color: #6c757d;
      cursor: not-allowed;
    }
    /* Metrics bar */
    .metrics-bar {
      margin-top: 10px;
      padding: 6px 10px;
      background-color: #e9ecef;
      border-radius: 4px;
      font-size: 12px;
      font-family: monospace;
      color: #495057;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    /* View tabs */
    .tabs-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid #dee2e6;
      margin-bottom: 15px;
    }
    .tabs-group {
      display: flex;
      gap: 4px;
    }
    .tab-btn {
      background: none;
      border: 1px solid transparent;
      padding: 7px 15px;
      font-size: 13px;
      font-weight: 500;
      color: #6c757d;
      border-radius: 4px 4px 0 0;
      cursor: pointer;
    }
    .tab-btn.active {
      color: #0d6efd;
      border-color: #dee2e6 #dee2e6 #ffffff;
      background-color: #ffffff;
      margin-bottom: -1px;
      border-bottom: 2px solid #0d6efd;
      font-weight: 600;
    }
    .btn-secondary {
      background-color: #ffffff;
      color: #495057;
      border: 1px solid #ced4da;
      padding: 4px 10px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-secondary:hover {
      background-color: #f8f9fa;
    }
    /* Structured View (Industry standard) */
    .patents-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .patent-card {
      border: 1px solid #dee2e6;
      border-radius: 6px;
      padding: 14px 16px;
      background-color: #ffffff;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }
    .patent-card:hover {
      border-color: #b0c4de;
    }
    .patent-header-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .patent-meta-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .patent-number {
      font-family: monospace;
      font-size: 13px;
      font-weight: 700;
      color: #0d6efd;
      background-color: #e7f1ff;
      padding: 2px 7px;
      border-radius: 3px;
    }
    .patent-status {
      font-size: 11px;
      font-weight: 600;
      color: #198754;
      background-color: #d1e7dd;
      padding: 1px 6px;
      border-radius: 3px;
      text-transform: uppercase;
    }
    .patent-dates {
      font-size: 12px;
      color: #6c757d;
      font-family: monospace;
    }
    .patent-title {
      font-size: 15px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 6px;
      line-height: 1.35;
    }
    .patent-details-grid {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 4px 12px;
      font-size: 12px;
      margin-bottom: 8px;
      color: #495057;
    }
    .detail-label {
      font-weight: 600;
      color: #6c757d;
    }
    .detail-value {
      color: #212529;
    }
    .detail-value.assignee {
      font-weight: 600;
      color: #0b5ed7;
    }
    .patent-snippet {
      font-size: 13px;
      color: #495057;
      line-height: 1.45;
      background-color: #fbfbfb;
      padding: 8px 10px;
      border-radius: 4px;
      border-left: 3px solid #dee2e6;
      margin-top: 6px;
    }
    .patent-actions {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #f1f3f5;
      display: flex;
      gap: 16px;
      font-size: 12px;
    }
    .patent-actions a {
      color: #0d6efd;
      text-decoration: none;
      font-weight: 500;
    }
    .patent-actions a:hover {
      text-decoration: underline;
    }
    /* Raw JSON View */
    pre {
      background-color: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: 4px;
      padding: 14px;
      font-size: 12px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      color: #212529;
      max-height: 600px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    footer {
      margin-top: 35px;
      padding-top: 14px;
      border-top: 1px solid #e9ecef;
      font-size: 12px;
      color: #adb5bd;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Sistema de Búsqueda de Patentes (Capstone)</h1>
      <div class="subtitle">Módulo de consulta a bases de patentes oficiales &bull; Céntrika - Awake</div>
    </header>

    <!-- Search Section -->
    <div class="search-section">
      <label for="query-input">Términos de búsqueda o ecuación de patentes:</label>
      <div class="input-row">
        <input 
          type="text" 
          id="query-input" 
          placeholder="Ingrese cualquier término o ecuación (ej: piezoelectric footwear, calzado sensores, Rogowski coil)"
          value="piezoelectric footwear"
        >
        <button id="search-btn" class="btn-search" onclick="buscar()">Buscar</button>
      </div>
      <div id="metrics-bar" class="metrics-bar" style="display: none;">
        <span id="status-info">Listo</span>
        <span id="duration-info"></span>
      </div>
    </div>

    <!-- View Switcher Tabs -->
    <div class="tabs-header">
      <div class="tabs-group">
        <button id="tab-cards" class="tab-btn active" onclick="cambiarVista('cards')">Resultados Estructurados</button>
        <button id="tab-raw" class="tab-btn" onclick="cambiarVista('raw')">Salida en Crudo (Raw JSON)</button>
      </div>
      <div>
        <button class="btn-secondary" id="copy-btn" onclick="copiarJson()">Copiar JSON</button>
      </div>
    </div>

    <!-- 1. Structured Results Container -->
    <div id="view-cards" class="patents-list">
      <div style="color: #6c757d; font-size: 13px; padding: 25px 0; text-align: center;">
        Iniciando consulta...
      </div>
    </div>

    <!-- 2. Raw JSON Container -->
    <div id="view-raw" style="display: none;">
      <pre id="raw-output">// Presione "Buscar" para obtener el JSON en crudo...</pre>
    </div>

    <footer>
      Grupo 6 Capstone &bull; Consulta en vivo a Google Patents API
    </footer>
  </div>

  <script>
    let rawJsonData = null;
    let currentTab = 'cards';

    function cambiarVista(tab) {
      currentTab = tab;
      document.getElementById('tab-cards').className = tab === 'cards' ? 'tab-btn active' : 'tab-btn';
      document.getElementById('tab-raw').className = tab === 'raw' ? 'tab-btn active' : 'tab-btn';

      document.getElementById('view-cards').style.display = tab === 'cards' ? 'flex' : 'none';
      document.getElementById('view-raw').style.display = tab === 'raw' ? 'block' : 'none';
    }

    async function buscar() {
      const q = document.getElementById('query-input').value.trim();
      if (!q) return;

      const btn = document.getElementById('search-btn');
      const metricsBar = document.getElementById('metrics-bar');
      const statusInfo = document.getElementById('status-info');
      const durationInfo = document.getElementById('duration-info');
      const cardsContainer = document.getElementById('view-cards');
      const rawOutput = document.getElementById('raw-output');

      btn.disabled = true;
      btn.textContent = "Buscando...";
      metricsBar.style.display = "flex";
      statusInfo.textContent = "Consultando Google Patents...";
      durationInfo.textContent = "";

      const t0 = performance.now();

      try {
        const res = await fetch(`/api/patents?q=${encodeURIComponent(q)}`);
        const data = await res.json();
        const duration = Math.round(performance.now() - t0);

        rawJsonData = data;
        rawOutput.textContent = JSON.stringify(data, null, 2);

        const organic = data.organic_results || [];
        const totalFound = data.search_information && data.search_information.total_results 
          ? Number(data.search_information.total_results).toLocaleString() 
          : organic.length;

        statusInfo.textContent = `Estado: 200 OK | ${organic.length} patentes desplegadas de aprox. ${totalFound} encontradas a nivel mundial`;
        durationInfo.textContent = `${duration} ms`;

        renderizarPatentes(organic);
      } catch (err) {
        statusInfo.textContent = "Error en la consulta: " + err.message;
        cardsContainer.innerHTML = `<div style="color: #dc3545; font-size: 13px; padding: 20px;">Fallo al conectar con el servidor: ${err.message}</div>`;
        rawOutput.textContent = JSON.stringify({ error: err.message }, null, 2);
      } finally {
        btn.disabled = false;
        btn.textContent = "Buscar";
      }
    }

    function renderizarPatentes(patents) {
      const container = document.getElementById('view-cards');
      if (!patents || patents.length === 0) {
        container.innerHTML = `<div style="color: #6c757d; font-size: 13px; padding: 30px; text-align: center;">No se encontraron patentes para esta búsqueda. Intente con otros términos o combinaciones en inglés.</div>`;
        return;
      }

      container.innerHTML = patents.map(p => {
        // Extraer número de publicación limpio (ej: US12278746B2)
        let pubNum = p.publication_number;
        if (!pubNum && p.patent_id) {
          const parts = p.patent_id.split('/');
          pubNum = parts.length >= 2 ? parts[1] : p.patent_id;
        }
        pubNum = pubNum || 'N/A';

        const title = p.title || 'Sin título registrado';
        const assignee = p.assignee || 'No especificado / Persona natural';
        const inventor = p.inventor || 'No especificado';
        const pubDate = p.publication_date || p.grant_date || 'No registrada';
        const filingDate = p.filing_date || p.priority_date || null;
        const snippet = p.snippet || '';
        const patentLink = p.patent_link || null;
        const pdfLink = p.pdf || null;

        // Estado legal si está disponible
        let statusBadge = '';
        if (p.country_status) {
          const firstCountry = Object.keys(p.country_status)[0];
          const st = p.country_status[firstCountry];
          if (st) {
            statusBadge = `<span class="patent-status">${st}</span>`;
          }
        }

        return `
          <div class="patent-card">
            <div class="patent-header-line">
              <div class="patent-meta-left">
                <span class="patent-number">${pubNum}</span>
                ${statusBadge}
              </div>
              <div class="patent-dates">
                ${filingDate ? `Solicitud: ${filingDate} | ` : ''}Publicación: ${pubDate}
              </div>
            </div>

            <div class="patent-title">${title}</div>

            <div class="patent-details-grid">
              <span class="detail-label">Titular / Solicitante:</span>
              <span class="detail-value assignee">${assignee}</span>

              <span class="detail-label">Inventor(es):</span>
              <span class="detail-value">${inventor}</span>
            </div>

            ${snippet ? `<div class="patent-snippet">${snippet}</div>` : ''}

            <div class="patent-actions">
              ${patentLink ? `<a href="${patentLink}" target="_blank" rel="noopener">Ver ficha en Google Patents &rarr;</a>` : ''}
              ${pdfLink ? `<a href="${pdfLink}" target="_blank" rel="noopener">Descargar Documento Oficial (PDF) &rarr;</a>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function copiarJson() {
      if (!rawJsonData) return;
      navigator.clipboard.writeText(JSON.stringify(rawJsonData, null, 2));
      const btn = document.getElementById('copy-btn');
      btn.textContent = "Copiado";
      setTimeout(() => btn.textContent = "Copiar JSON", 1500);
    }

    // Permitir buscar presionando la tecla Enter
    document.getElementById('query-input').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        buscar();
      }
    });

    // Ejecutar búsqueda inicial al cargar la página
    window.addEventListener('DOMContentLoaded', () => {
      buscar();
    });
  </script>

</body>
</html>
